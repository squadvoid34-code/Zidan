<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Catur Mabar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f4f1ea;--fg:#222;--lt:#ecd9b5;--dk:#a97d52;--hl:#f6e05e99;--ok:#3b82f6;
  --card:#fffe;--b1:#f7efe0;--b2:#d9b98a;--chk:#0000000d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1c1b19;--fg:#eee;--card:#2a2926ee;--b1:#2b2723;--b2:#14120f;--chk:#ffffff0a}
}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#eee;--card:#2a2926ee;--b1:#2b2723;--b2:#14120f;--chk:#ffffff0a}
*{box-sizing:border-box}
html{min-height:100%;background:var(--b2)}
body{
  margin:0;min-height:100vh;
  background:conic-gradient(var(--chk) 25%,transparent 0 50%,var(--chk) 0 75%,transparent 0) 0 0/64px 64px,
             radial-gradient(ellipse at top,var(--b1),var(--b2)) fixed;
  color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:12px;
  justify-content:center;padding-bottom:50px;
}
h1{margin:0;font-size:26px;letter-spacing:1px}
.card{
  background:var(--card);box-shadow:0 6px 24px #0003;backdrop-filter:blur(6px);
  border-radius:12px;padding:14px;width:min(92vw,480px);
  display:flex;flex-direction:column;gap:10px;
}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #8885;background:var(--bg);color:var(--fg)}
button{cursor:pointer;background:var(--ok);color:#fff;border:0;font-weight:600}
button.alt{background:#8886}
button:disabled{opacity:.5;cursor:not-allowed}
input{text-align:center}
#game{display:none;flex-direction:column;align-items:center;gap:10px;width:100%}
#bd{
  --s:min(92vw,480px);width:var(--s);height:var(--s);
  display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);
  border:3px solid var(--dk);border-radius:4px;overflow:hidden;box-shadow:0 10px 30px #0005;
}
.sq{position:relative;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--s)/8 * .78);line-height:1;cursor:pointer;user-select:none}
.l{background:var(--lt)}.d{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px var(--hl)}
.sq.sel{box-shadow:inset 0 0 0 100px #3b82f688}
.sq.chk{box-shadow:inset 0 0 0 100px #ef444499}
.sq.tg::after{content:"";width:28%;height:28%;border-radius:50%;background:#0006;position:absolute}
.sq.tg.cap::after{width:92%;height:92%;background:none;border:4px solid #0006}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
.k{color:#111;text-shadow:0 0 1px #fff6}
#st{font-weight:600;text-align:center;min-height:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
small{opacity:.7;text-align:center}
.brand{text-align:center}
.brand h1{background:linear-gradient(90deg,#f6c453,#f08a4b);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;margin-top:2px;font-weight:600}
#lobby{align-items:center;text-align:center;gap:14px;border:1px solid #f6c45344}
#lobby input{width:100%}
#lobby button{width:100%;max-width:300px}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800}
.vs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.vs img,.pl img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #f6c453;box-shadow:0 4px 14px #0005}
.pl{width:min(92vw,480px);display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:6px 10px;border:2px solid transparent;transition:.25s}
.pl img{width:46px;height:46px}
.pl div{display:flex;flex-direction:column;font-size:14px}
.pl span{font-size:12px;opacity:.7}
.pl.act{border-color:#f6c453;box-shadow:0 0 16px #f6c45388}
.pl.act img{animation:pu 1.4s infinite}
@keyframes pu{50%{transform:scale(1.07)}}
#wm{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;font-weight:600;opacity:.8;pointer-events:none}
#mu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;z-index:5;background:#f08a4b}
#mu.off{background:#8886}
.fx{position:fixed;pointer-events:none;z-index:30}
.fx.em{font-size:46px;transform:translate(-50%,-50%);animation:em .9s ease-out forwards}
@keyframes em{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(2.1) rotate(300deg);opacity:0}}
.fx.boom{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd23f 25%,#ff6b1a 55%,transparent 70%);animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.8);opacity:0}}
.fx.lbl{font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 6px #000,0 0 14px var(--c),0 0 22px var(--c);transform:translate(-50%,-50%);animation:lb 1.1s ease-out forwards;white-space:nowrap}
@keyframes lb{0%{opacity:0;margin-top:0}20%{opacity:1}100%{opacity:0;margin-top:-56px}}
#bd.shake{animation:sh .45s}
@keyframes sh{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
#rh{font-weight:700;background:var(--card);padding:6px 14px;border-radius:99px;font-size:14px;cursor:pointer;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#info{text-align:center;font-size:13px;opacity:.8;min-height:18px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
code{background:#0002;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div class="brand">
  <h1>♟ Catur Mabar</h1>
  <small>versi lengkap • siap main</small>
</div>

<div class="card" id="lobby">
  <div class="vs">
    <div><img id="v1" src="https://api.dicebear.com/7.x/avataaars/svg?seed=P1&backgroundColor=b6e3f4" alt="">P1 Putih</div>
    VS
    <div><img id="v2" src="https://api.dicebear.com/7.x/avataaars/svg?seed=P2&backgroundColor=ffd5dc" alt="">P2 Hitam</div>
  </div>

  <input id="rn" maxlength="24" placeholder="Nama room (opsional)" style="text-transform:none;letter-spacing:0">
  <button id="mk">Buat Room Online</button>
  <div style="font-size:13px;opacity:.7">— atau —</div>
  <input id="code" placeholder="Masukkan kode room" style="text-transform:none;letter-spacing:0">
  <button id="jn">Gabung Room</button>
  <button class="alt" id="lc">Main berdua di 1 HP (Lokal)</button>
  <small id="err" style="color:#ef4444"></small>
  <small style="margin-top:6px">Online memakai PeerJS (gratis, tanpa akun)</small>
</div>

<div id="game">
  <div id="rh" title="Ketuk untuk salin kode"></div>
  <div id="st"></div>
  <div class="pl" id="pt"></div>
  <div id="bd"></div>
  <div class="pl" id="pbm"></div>
  <small id="info"></small>
  <div class="row">
    <button id="rs" class="alt">Ulang Game</button>
    <button id="bk" class="alt">Keluar</button>
  </div>
</div>

<div id="wm">Catur Mabar • siap main bareng</div>
<button id="mu" title="Musik / Suara">🎵</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  // ============ STATE ============
  const chess = new Chess();
  let mode = null;          // 'local' | 'online'
  let myColor = 'w';       // 'w' | 'b'
  let selected = null;
  let lastMove = null;
  let peer = null;
  let conn = null;
  let roomCode = '';
  let isHost = false;
  let soundOn = true;
  let gameOver = false;

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const lobby = $('lobby'), game = $('game'), bd = $('bd');
  const st = $('st'), info = $('info'), rh = $('rh'), err = $('err');
  const pt = $('pt'), pbm = $('pbm');

  // ============ AUDIO (Web Audio sederhana) ============
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function beep(freq=440, dur=0.08, type='sine', vol=0.15){
    if(!soundOn) return;
    try{
      if(!actx) actx = new AudioCtx();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    }catch(e){}
  }
  function sfxMove(){ beep(520,0.06,'triangle',0.12); }
  function sfxCapture(){ beep(180,0.12,'sawtooth',0.18); setTimeout(()=>beep(90,0.15,'sawtooth',0.12),40); }
  function sfxCheck(){ beep(880,0.1,'square',0.1); setTimeout(()=>beep(1100,0.15,'square',0.1),80); }
  function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sine',0.15),i*120)); }

  $('mu').onclick = () => {
    soundOn = !soundOn;
    $('mu').classList.toggle('off', !soundOn);
    $('mu').textContent = soundOn ? '🎵' : '🔇';
  };

  // ============ EFFECTS ============
  function fx(type, x, y, text, color){
    const el = document.createElement('div');
    el.className = 'fx ' + type;
    if(type === 'lbl'){ el.style.setProperty('--c', color||'#f6c453'); el.textContent = text; }
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1200);
  }
  function shake(){ bd.classList.remove('shake'); void bd.offsetWidth; bd.classList.add('shake'); }

  // ============ BOARD RENDER ============
  const PIECES = {
    wP:'♙',wR:'♖',wN:'♘',wB:'♗',wQ:'♕',wK:'♔',
    bP:'♟',bR:'♜',bN:'♞',bB:'♝',bQ:'♛',bK:'♚'
  };

  function sqColor(r,c){ return (r+c)%2===0 ? 'l' : 'd'; }

  function render(highlights = []){
    bd.innerHTML = '';
    const board = chess.board();
    const isFlipped = myColor === 'b';

    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const rank = isFlipped ? r : 7-r;
        const file = isFlipped ? 7-c : c;
        const sq = String.fromCharCode(97+file) + (rank+1);
        const piece = board[rank][file];
        const el = document.createElement('div');
        el.className = 'sq ' + sqColor(rank,file);
        el.dataset.sq = sq;

        if(piece){
          const key = (piece.color==='w'?'w':'b') + piece.type.toUpperCase();
          el.textContent = PIECES[key];
          el.classList.add(piece.color==='w' ? 'w' : 'k');
        }

        if(lastMove && (sq === lastMove.from || sq === lastMove.to)) el.classList.add('last');
        if(selected === sq) el.classList.add('sel');
        if(chess.in_check() && piece && piece.type==='k' && piece.color===chess.turn()) el.classList.add('chk');

        const hl = highlights.find(h => h.sq === sq);
        if(hl){
          el.classList.add('tg');
          if(hl.capture) el.classList.add('cap');
        }

        el.onclick = () => onSquareClick(sq);
        bd.appendChild(el);
      }
    }
    updateStatus();
    updatePlayers();
  }

  function getLegal(from){
    return chess.moves({square:from, verbose:true}).map(m => ({
      sq: m.to,
      capture: !!m.captured
    }));
  }

  // ============ CLICK HANDLER ============
  function onSquareClick(sq){
    if(gameOver) return;
    if(mode === 'online' && chess.turn() !== myColor) return;

    if(selected){
      const moves = chess.moves({square:selected, verbose:true});
      const move = moves.find(m => m.to === sq);
      if(move){
        doMove(selected, sq, move.promotion);
        return;
      }
      // klik piece sendiri lagi → ganti seleksi
      const p = chess.get(sq);
      if(p && p.color === chess.turn()){
        selected = sq;
        render(getLegal(sq));
        return;
      }
      selected = null;
      render();
      return;
    }

    const p = chess.get(sq);
    if(p && p.color === chess.turn()){
      selected = sq;
      render(getLegal(sq));
    }
  }

  function doMove(from, to, promo){
    const move = chess.move({from, to, promotion: promo || 'q'});
    if(!move) return;

    lastMove = {from, to};
    selected = null;

    // SFX & FX
    const rect = bd.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    if(move.captured){
      sfxCapture();
      fx('boom', cx, cy);
      shake();
    } else {
      sfxMove();
    }
    if(chess.in_check()){
      sfxCheck();
      fx('lbl', cx, cy-40, 'SKAK!', '#ef4444');
    }

    render();

    // kirim ke lawan jika online
    if(mode === 'online' && conn && conn.open){
      conn.send({type:'move', from, to, promotion: move.promotion || null, fen: chess.fen()});
    }

    checkEnd();
  }

  function checkEnd(){
    if(chess.in_checkmate()){
      gameOver = true;
      const winner = chess.turn() === 'w' ? 'Hitam' : 'Putih';
      st.textContent = `🏆 Skakmat! ${winner} menang`;
      sfxWin();
      fx('lbl', window.innerWidth/2, window.innerHeight/2, 'SKAKMAT!', '#f6c453');
    } else if(chess.in_stalemate()){
      gameOver = true;
      st.textContent = '🤝 Stalemate (seri)';
    } else if(chess.in_draw()){
      gameOver = true;
      st.textContent = '🤝 Seri';
    }
  }

  function updateStatus(){
    if(gameOver) return;
    if(mode === 'local'){
      st.textContent = chess.turn() === 'w' ? 'Giliran Putih' : 'Giliran Hitam';
    } else {
      st.textContent = chess.turn() === myColor ? 'Giliran kamu' : 'Menunggu lawan...';
    }
  }

  function updatePlayers(){
    const turn = chess.turn();
    const whiteActive = turn === 'w';
    pt.className = 'pl' + (whiteActive ? ' act' : '');
    pbm.className = 'pl' + (!whiteActive ? ' act' : '');

    pt.innerHTML = `
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=White&backgroundColor=b6e3f4">
      <div><b>Putih</b><span>${myColor==='w' && mode==='online' ? 'Kamu' : (mode==='local'?'Lokal':'Lawan')}</span></div>`;
    pbm.innerHTML = `
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Black&backgroundColor=ffd5dc">
      <div><b>Hitam</b><span>${myColor==='b' && mode==='online' ? 'Kamu' : (mode==='local'?'Lokal':'Lawan')}</span></div>`;
  }

  // ============ PEERJS ONLINE ============
  function createRoom(){
    err.textContent = '';
    $('mk').disabled = true;
    $('mk').innerHTML = '<span class="spinner"></span> Membuat...';

    peer = new Peer({debug:0});
    peer.on('open', id => {
      roomCode = id;
      isHost = true;
      myColor = 'w';
      mode = 'online';
      rh.textContent = 'Kode: ' + id;
      rh.onclick = () => {
        navigator.clipboard.writeText(id).then(()=>{
          info.textContent = 'Kode disalin!';
          setTimeout(()=>info.textContent='',1500);
        });
      };
      startGame();
      info.textContent = 'Menunggu lawan join... Bagikan kode di atas';
      $('mk').disabled = false;
      $('mk').textContent = 'Buat Room Online';
    });

    peer.on('connection', c => {
      conn = c;
      setupConn();
      info.textContent = 'Lawan terhubung! Kamu main Putih.';
      // kirim posisi awal
      conn.send({type:'sync', fen: chess.fen(), color: 'b'});
    });

    peer.on('error', e => {
      err.textContent = 'Gagal: ' + e.type;
      $('mk').disabled = false;
      $('mk').textContent = 'Buat Room Online';
    });
  }

  function joinRoom(){
    const code = $('code').value.trim();
    if(!code){ err.textContent = 'Masukkan kode room dulu'; return; }
    err.textContent = '';
    $('jn').disabled = true;
    $('jn').innerHTML = '<span class="spinner"></span> Menghubungkan...';

    peer = new Peer({debug:0});
    peer.on('open', () => {
      conn = peer.connect(code, {reliable:true});
      conn.on('open', () => {
        isHost = false;
        myColor = 'b';
        mode = 'online';
        roomCode = code;
        rh.textContent = 'Kode: ' + code;
        setupConn();
        startGame();
        info.textContent = 'Terhubung! Kamu main Hitam.';
        $('jn').disabled = false;
        $('jn').textContent = 'Gabung Room';
      });
      conn.on('error', () => {
        err.textContent = 'Gagal join. Cek kode / koneksi.';
        $('jn').disabled = false;
        $('jn').textContent = 'Gabung Room';
      });
    });
    peer.on('error', e => {
      err.textContent = 'Error: ' + e.type;
      $('jn').disabled = false;
      $('jn').textContent = 'Gabung Room';
    });
  }

  function setupConn(){
    conn.on('data', data => {
      if(data.type === 'move'){
        // terima gerakan lawan
        const move = chess.move({from: data.from, to: data.to, promotion: data.promotion || 'q'});
        if(move){
          lastMove = {from: data.from, to: data.to};
          selected = null;
          if(move.captured){ sfxCapture(); shake(); } else sfxMove();
          if(chess.in_check()) sfxCheck();
          render();
          checkEnd();
        }
      } else if(data.type === 'sync'){
        chess.load(data.fen);
        myColor = data.color;
        render();
      } else if(data.type === 'reset'){
        chess.reset();
        lastMove = null;
        selected = null;
        gameOver = false;
        render();
        info.textContent = 'Game diulang';
      }
    });
    conn.on('close', () => {
      info.textContent = 'Lawan terputus';
      st.textContent = 'Koneksi terputus';
    });
  }

  // ============ START / RESET ============
  function startGame(){
    lobby.style.display = 'none';
    game.style.display = 'flex';
    chess.reset();
    lastMove = null;
    selected = null;
    gameOver = false;
    render();
  }

  function resetGame(){
    chess.reset();
    lastMove = null;
    selected = null;
    gameOver = false;
    render();
    if(mode === 'online' && conn && conn.open){
      conn.send({type:'reset'});
    }
    info.textContent = 'Game diulang';
  }

  function backToLobby(){
    if(conn) try{ conn.close(); }catch(e){}
    if(peer) try{ peer.destroy(); }catch(e){}
    peer = null; conn = null;
    mode = null;
    game.style.display = 'none';
    lobby.style.display = 'flex';
    err.textContent = '';
    info.textContent = '';
    $('code').value = '';
    $('rn').value = '';
  }

  // ============ BUTTONS ============
  $('mk').onclick = createRoom;
  $('jn').onclick = joinRoom;
  $('lc').onclick = () => {
    mode = 'local';
    myColor = 'w'; // tidak dipakai di lokal
    rh.textContent = 'Mode Lokal';
    startGame();
    info.textContent = 'Main berdua di perangkat yang sama';
  };
  $('rs').onclick = resetGame;
  $('bk').onclick = backToLobby;

  // initial
  render();
})();
</script>
</body>
</html>
