<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Catur Mabar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1ea;--fg:#222;--lt:#ecd9b5;--dk:#a97d52;--hl:#f6e05e99;--ok:#3b82f6;--card:#fffe;--b1:#f7efe0;--b2:#d9b98a;--chk:#0000000d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#eee;--card:#2a2926ee;--b1:#2b2723;--b2:#14120f;--chk:#ffffff0a}}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#eee;--card:#2a2926ee;--b1:#2b2723;--b2:#14120f;--chk:#ffffff0a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--b2)}
body{margin:0;min-height:100vh;background:conic-gradient(var(--chk) 25%,transparent 0 50%,var(--chk) 0 75%,transparent 0) 0 0/64px 64px,radial-gradient(ellipse at top,var(--b1),var(--b2)) fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:12px}
h1{margin:0;font-size:26px;letter-spacing:1px;text-shadow:0 2px 8px #0003}
.card{background:var(--card);box-shadow:0 6px 24px #0003;backdrop-filter:blur(6px);border-radius:12px;padding:14px;width:min(92vw,480px);display:flex;flex-direction:column;gap:10px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #8885;background:var(--bg);color:var(--fg)}
button{cursor:pointer;background:var(--ok);color:#fff;border:0}
button.alt{background:#8886}
input{text-transform:uppercase;letter-spacing:2px;text-align:center}
#game{display:none;flex-direction:column;align-items:center;gap:10px}
#bd{--s:min(92vw,480px);width:var(--s);height:var(--s);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border:3px solid var(--dk);border-radius:4px;overflow:hidden;box-shadow:0 10px 30px #0005}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)/8*.78);line-height:1;cursor:pointer;user-select:none}
.l{background:var(--lt)}.d{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px var(--hl)}
.sq.sel{box-shadow:inset 0 0 0 100px #3b82f688}
.sq.chk{box-shadow:inset 0 0 0 100px #ef444499}
.sq.tg::after{content:"";width:28%;height:28%;border-radius:50%;background:#0006;position:absolute}
.sq.tg.cap::after{width:92%;height:92%;background:none;border:4px solid #0006}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
.k{color:#111;text-shadow:0 0 1px #fff6}
#st{font-weight:600;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
small{opacity:.7;text-align:center}

body{justify-content:center}
.vb{vertical-align:-2px;margin-left:3px}
.brand{text-align:center}
.brand h1{background:linear-gradient(90deg,#f6c453,#f08a4b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.brand small{display:block;margin-top:2px;font-weight:600}
#lobby{align-items:center;text-align:center;gap:14px;border:1px solid #f6c45344}
#lobby input{width:100%}#lobby button{width:100%;max-width:300px}
#lobby .row{width:100%;justify-content:center}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800}
.vs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.vs img,.pl img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #f6c453;box-shadow:0 4px 14px #0005}
.pl{width:min(92vw,480px);display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:6px 10px;border:2px solid transparent;transition:.25s}
.pl img{width:46px;height:46px}
.pl div{display:flex;flex-direction:column;font-size:14px}.pl span{font-size:12px;opacity:.7}
.pl.act{border-color:#f6c453;box-shadow:0 0 16px #f6c45388}
.pl.act img{animation:pu 1.4s infinite}
@keyframes pu{50%{transform:scale(1.07)}}
#wm{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;font-weight:600;opacity:.8;pointer-events:none}
#mu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;z-index:5;background:#f08a4b}
#mu.off{background:#8886}
body{padding-bottom:40px}

.fx{position:fixed;pointer-events:none;z-index:30}
.fx.em{font-size:46px;transform:translate(-50%,-50%);animation:em .9s ease-out forwards}
@keyframes em{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(2.1) rotate(300deg);opacity:0}}
.fx.boom{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd23f 25%,#ff6b1a 55%,transparent 70%);animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.8);opacity:0}}
.fx.lbl{font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 6px #000,0 0 14px var(--c),0 0 22px var(--c);transform:translate(-50%,-50%);animation:lb 1.1s ease-out forwards;white-space:nowrap}
@keyframes lb{0%{opacity:0;margin-top:0}20%{opacity:1}100%{opacity:0;margin-top:-56px}}
.fx.bolt{left:0;top:0;width:100vw;height:100vh;animation:bl .6s forwards}
@keyframes bl{0%,30%,60%{opacity:1}15%,45%{opacity:.2}100%{opacity:0}}
.fx.flash{left:0;top:0;width:100vw;height:100vh;background:#fff;animation:fl .35s forwards}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
.fx.wd{width:150px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 8px #7ee0ff;opacity:0;animation:wd .6s ease-out forwards}
@keyframes wd{0%{opacity:0;transform:translateX(-90px)}30%{opacity:1}100%{opacity:0;transform:translateX(120px)}}
#bd.shake{animation:sh .45s}
@keyframes sh{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

.sp{font-size:12px;opacity:.7;font-weight:700}
.rl{width:100%;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.ri{display:flex;align-items:center;gap:8px;background:#8881;border:1px solid #8884;border-radius:10px;padding:8px 10px;text-align:left}
.ri .m{flex:1;min-width:0}.ri b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri code{font-size:12px;letter-spacing:1px;opacity:.8}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#f6c45355;font-weight:700;white-space:nowrap}
#lobby .ri button{width:auto;padding:7px 12px}
#rh{font-weight:700;background:var(--card);padding:6px 14px;border-radius:99px;font-size:14px;cursor:pointer;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>

<div class="card" id="lobby">
<div class="vs"><div><img id="v1" alt="">P1 Putih</div>VS<div><img id="v2" alt="">P2 Hitam</div></div>
<input id="rn" maxlength="24" placeholder="Nama room (contoh: Duel Seru)" style="text-transform:none;letter-spacing:0">
<input id="rc" maxlength="8" placeholder="Kode room (kosongkan = acak)">
<button id="mk">Buat room</button>
<div class="sp">— Daftar room —</div>
<input id="code" placeholder="🔍 Cari nama / kode room" style="text-transform:none;letter-spacing:0">
<div id="rl" class="rl"><small>Menghubungkan...</small></div>
<button class="alt" id="lc">Main berdua di 1 HP (lokal)</button>
<small id="err"></small>
</div>
<div id="game">
<div id="rh" title="Ketuk untuk salin kode"></div><div id="st"></div><div class="pl" id="pt"></div><div id="bd"></div><div class="pl" id="pbm"></div>
